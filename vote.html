/* 動畫 */
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes stamp{0%{transform:scale(2) rotate(-30deg);opacity:0}60%{transform:scale(.9) rotate(-14deg);opacity:1}100%{transform:scale(1) rotate(-14deg)}}

@keyframes ring{0%,100%{box-shadow:inset 0 0 0 1.5px rgba(31,53,82,.12),0 0 0 0 rgba(126,194,232,.55)}50%{box-shadow:inset 0 0 0 1.5px rgba(31,53,82,.12),0 0 0 8px rgba(126,194,232,0)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.hb.bump svg{animation:pop .32s ease-out}
.stp.bump{animation:stamp .26s ease-out both}
.spin svg{animation:spin1 .7s ease-in-out}

});
document.addEventListener('input', e => { const id = e.target.id;
  if (id === 'q') { q = e.target.value; renderList(); }

function fatal() { $('#bar').innerHTML = ''; head(); $('#app').innerHTML = `<div class="card fatal"><b style="font-size:18px">${t('fatalT')}</b><span>${t('fatalB')}</span><button class="btn go" onclick="location.reload()">${t('retry')}</button></div>`; }
async function loadSheets(src) {
  const get1 = async k => { const u = src?.[k]; if (!u) return ''; try { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw 0; const tx = await r.text(); try { localStorage.setItem('hv_csv_' + k, tx); } catch {} return tx; }
    catch { try { return localStorage.getItem('hv_csv_' + k) || ''; } catch { return ''; } } };
  const [songs, mv, releases] = await Promise.all([get1('songs'), get1('mv'), get1('releases')]);
  if (!songs) throw new Error('songs sheet unavailable');
  const r = buildData({ songs, mv, releases }, location.href); if (r.warn.length) console.warn(r.warn.join('\n')); return r;

async function route() {
  stopAudio(); menuOpen = false; const h = location.hash;
  if (h.startsWith('#s=')) sharedS(h.slice(3)); else if (h.startsWith('#r=') || h.startsWith('#v=') || h.startsWith('#w=')) shared(h); else if (h.startsWith('#results')) results(h.split('/')[1]);

(async () => {
