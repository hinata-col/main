  g.fillStyle = '#fff'; g.font = `900 52px ${F}`; g.fillText(t('ttl'), 50, 80); g.font = `700 30px ${F}`; g.fillText(String(year) + (nick ? '　' + nick + t('nickSuf') : ''), 50, 125);
  g.fillStyle = '#e0f2fe'; g.fillRect(0, 150, W, 460); g.fillStyle = '#0369a1'; g.font = `900 44px ${F}`; g.fillText(t('mine') + cn(main), 50, 215);
  const sz = ids.length === 1 ? 340 : ids.length === 2 ? 320 : 290, gap = 40, x0 = (W - (sz * ids.length + gap * (ids.length - 1))) / 2;
  ids.forEach((id, k) => { const x = x0 + k * (sz + gap), y = 245; g.save(); g.beginPath(); g.roundRect(x, y, sz, sz, 28); g.clip();
    if (ims[k]) g.drawImage(ims[k], x, y, sz, sz); else { g.fillStyle = '#7dd3fc'; g.fillRect(x, y, sz, sz); } g.restore();
    g.fillStyle = '#0f172a'; g.font = `800 26px ${F}`; let s = songs[id].title; while (g.measureText(s).width > sz && s.length > 3) s = s.slice(0, -2) + '…'; g.fillText(s, x, y + sz + 40); });
  let y = 690; const rest = ps.filter(c => c !== main);
  rest.slice(0, 6).forEach(c => { g.fillStyle = '#0284c7'; g.font = `900 30px ${F}`; g.fillText(cn(c), 50, y);
    g.fillStyle = '#0f172a'; g.font = `700 32px ${F}`; let s = songs[sel[c.id][0]].title + (sel[c.id].length > 1 ? t('etc')(sel[c.id].length) : ''); while (g.measureText(s).width > 700 && s.length > 4) s = s.slice(0, -2) + '…'; g.fillText(s, 290, y); y += 78; });
  if (rest.length > 6) { g.fillStyle = '#0ea5e9'; g.font = `800 30px ${F}`; g.fillText(t('more')(rest.length - 6), 50, y); }
  g.fillStyle = '#64748b'; g.font = `700 28px ${F}`; g.fillText('#日向坂46歌曲總選舉　' + location.host + location.pathname, 50, H - 50); return cv; }
async function shareImg(dl) { let blob; try { blob = await new Promise(async r => (await card(true)).toBlob(r)); } catch { blob = null; }
  if (!blob) blob = await new Promise(async r => (await card(false)).toBlob(r)); // 圖片跨網域被擋時退回無封面版
  const f = new File([blob], 'hinata-vote.png', { type: 'image/png' });
  if (!dl && navigator.canShare?.({ files: [f] })) { try { await navigator.share({ files: [f], text: text() }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click(); }

// ---- 分享連結（唯讀） ----
function shared(h) { const [main, nk] = h.slice(3).split('&n='); const [y, body] = main.split('~'); const o = {}; let nm = ''; try { nm = decodeURIComponent(nk || '').slice(0, 20); } catch {}
  (body || '').split(';').forEach(p => { const [c, v] = p.split(':'); if (v && cats.some(x => x.id === c)) o[c] = v.split(',').filter(i => songs[i]).slice(0, MAX); });
  head(); document.title = t('shNick')(y, nm); $('#app').innerHTML = `<div class="bg-white border-l-4 border-sky-400 rounded-xl px-4 py-3 mb-4 text-sm">${esc(t('shNick')(y, nm))}</div>` +
    cats.filter(c => o[c.id]?.length).map(c => `<h2 class="text-lg font-black border-b-[3px] border-[#7EC2E8] pb-1 mt-5 mb-3">${esc(cn(c))}</h2><div class="bg-white rounded-3xl overflow-hidden border border-slate-200">${o[c.id].map(i => item(songs[i], { ...c, view: 'list' }, true)).join('')}</div>`).join('') +
    `<div class="mt-6"><a href="${location.pathname}" class="btn inline-flex items-center bg-sky-500 text-white">${t('me')}</a></div>`; }

// ---- 歷年結果 ----
async function results(y) { head(); y = y || year; let d = null;
  try { const r = await fetch(`data/results/${y}.json`); if (r.ok) d = await r.json(); } catch {}
  if (!d) { try { d = (await get(ref(db, `results/${y}`))).val(); } catch {} }
  let g = false;
  const draw = () => { const tl = (g ? d?.tallyGoogle : d?.tally) || {}, n = g ? d?.totalGoogle : d?.total;
    $('#app').innerHTML = `<div class="flex flex-wrap items-center gap-2 mb-4"><h2 class="text-xl font-black mr-auto">${t('resT')}</h2>
     <select id="ry" class="min-h-[44px] rounded-xl border border-slate-300 bg-white px-3 text-sm">${Object.keys(E.editions).map(k => `<option ${k == y ? 'selected' : ''}>${k}</option>`).join('')}</select>
     <button data-g="0" class="btn ${g ? 'bg-slate-100' : 'bg-sky-500 text-white'}">${t('resAll')}</button><button data-g="1" class="btn ${g ? 'bg-sky-500 text-white' : 'bg-slate-100'}">${t('resG')}</button></div>` +
     (!d ? `<div class="bg-white border-l-4 border-sky-400 rounded-xl px-4 py-3 text-sm">${t('resNone')}</div>` :
      `<p class="text-sm text-slate-500 mb-3">${t('ppl')(n ?? 0)}</p>` + cats.map(c => { const e = Object.entries(tl[c.id] || {}).sort((a, b) => b[1] - a[1]).slice(0, 10), mx = e[0]?.[1] || 1;
        return `<h3 class="text-lg font-black border-b-[3px] border-[#7EC2E8] pb-1 mt-6 mb-2">${esc(cn(c))}</h3>` + e.map(([id, v], i) => `<div class="relative bg-white rounded-xl mb-1 overflow-hidden"><div class="absolute inset-y-0 left-0 bg-sky-100" style="width:${v / mx * 100}%"></div><div class="relative flex gap-3 px-3 py-2 text-sm"><b class="w-6 text-sky-600">${i + 1}</b><span class="flex-1 font-bold">${esc(songs[id]?.title || id)}</span><b>${v}</b></div></div>`).join(''); }).join(''));
    $('#ry')?.addEventListener('change', e => { location.hash = '#results/' + e.target.value; });
    $('#app').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { g = b.dataset.g === '1'; draw(); }); };
  draw(); }

// ---- 啟動 ----
function route() { stopAudio(); const h = location.hash;
  if (h.startsWith('#r=')) shared(h); else if (h.startsWith('#results')) results(h.split('/')[1]);
  else if (h === '#admin') import('./js/vote-admin.js').then(m => m.mountAdmin($('#app'), { songs, cats, year })).catch(() => toast(t('fail')));
  else render(); }
(async () => {
  [E, S] = await Promise.all([fetch(DATA + 'editions.json').then(r => r.json()), fetch(DATA + 'songs.json').then(r => r.json())]);
  year = E.current; ed = E.editions[year]; cats = ed.categories; songs = Object.fromEntries(S.map(s => [s.id, s]));
  try { sel = JSON.parse(localStorage.getItem('hv_draft_' + year) || '{}'); } catch {}
  route(); addEventListener('hashchange', route);
  try { const app = initializeApp(FB); auth = getAuth(app); db = getDatabase(app);
    try { deadline = (await get(ref(db, `config/${year}/deadline`))).val() || 0; } catch (e) { console.warn('讀取 config/' + year + '/deadline 失敗：請檢查 Rules 是否已「發布」，以及 databaseURL 是否正確', e); }
    try { const n = (await get(ref(db, `stats/${year}/count`))).val(); if (typeof n === 'number') count = n; } catch {}
    onAuthStateChanged(auth, async u => { if (!u) { try { await signInAnonymously(auth); } catch { toast(t('conn')); } return; } user = u;
      const v = (await get(ref(db, `votes/${year}/${u.uid}`))).val();
      if (v) { hasVoted = true; sel = Object.fromEntries(Object.entries(v.choices || {}).map(([k, a]) => [k, Object.values(a)])); } else hasVoted = false;
      if (!location.hash || location.hash === '#') render(); else head(); });
  } catch (e) { console.error(e); toast(t('conn')); }
})();
</script>
