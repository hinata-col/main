:root{--ink:#1F3552;--sky:#7EC2E8;--sun:#F5E050;--bl:#1F7FBF;--co:#D9456B;--mut:#4A6178;--ln:#BFD9EA;--bg:#DCEEF9;--sh:0 6px 18px rgba(31,53,82,.1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;font-family:"VoteRound","Hiragino Maru Gothic ProN","Yu Gothic UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--bl)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px;border-radius:8px}
.bgp{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.wrap{max-width:680px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom))}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px}
.hl{position:relative;z-index:0;display:inline-block}
.hl::after{content:"";position:absolute;left:-4px;right:-6px;bottom:1px;height:.5em;background:rgba(245,224,80,.85);border-radius:5px 9px 6px 10px;z-index:-1;filter:url(#rough)}
.rough{filter:url(#rough)}
.card{background:#fff;border-radius:16px;box-shadow:var(--sh)}
.pad{padding:14px 16px}

/* 標題區 */
.hd{position:relative}
.hd1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hr{display:flex;align-items:center;gap:8px}
.stk{display:inline-block;border:3px solid #fff;border-radius:10px;box-shadow:0 3px 8px rgba(31,53,82,.18);padding:1px 8px;font-size:12px;font-weight:900;background:var(--sun)}
.lang,.login{background:#fff;border-radius:999px;padding:0 14px;box-shadow:0 3px 8px rgba(31,53,82,.15);font-size:14px}
.av{width:44px;height:44px;border-radius:50%;background:var(--sun);border:3px solid #fff;box-shadow:0 3px 8px rgba(31,53,82,.2);font-weight:900;font-size:16px;padding:0;flex:none}
.en{margin-top:14px;font-size:11px;font-weight:900;letter-spacing:.12em;color:#17608E}
.ttl{position:relative;margin:2px 0 0;padding-right:64px;font-size:27px;line-height:1.3;font-weight:900}
.bl{color:var(--bl)}
.sunb{position:absolute;right:0;top:-4px}
.tg1{margin-top:12px;font-size:16px;font-weight:900;line-height:1.5}
.tg2{font-size:13px;font-weight:700;color:var(--mut);line-height:1.6}
.chips2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.cnt{display:inline-flex;align-items:center;gap:6px;background:#fff;font-size:13px;padding:4px 12px 4px 8px}
.days{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(31,53,82,.12);font-size:14px;font-weight:900;color:var(--ink)}
.menu{position:absolute;right:0;top:56px;width:250px;max-width:calc(100vw - 32px);background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(31,53,82,.25);z-index:20;overflow:hidden}
.pm{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1.5px solid var(--ln)}
.pm .av{display:inline-flex;align-items:center;justify-content:center;line-height:1;width:38px;height:38px;font-size:15px;box-shadow:none;border-radius:50%}
.pm b{display:block;font-size:15px;line-height:1.3;word-break:break-all}
.pm div>span{font-size:12px;color:var(--mut);font-weight:700}
.mi{width:100%;min-height:44px;padding:0 14px;text-align:left;font-size:14px;font-weight:800;display:flex;align-items:center}
.mi:hover{background:#EAF3FA}
.dg{color:var(--co)}

/* 便利貼、分頁 */
.note{margin-top:14px;background:#FBF6C8;border:3px solid #fff;border-radius:14px;box-shadow:0 3px 10px rgba(31,53,82,.15);padding:10px 14px;font-size:13px;font-weight:700;line-height:1.6}
.note2{margin-top:18px;font-size:13px;line-height:1.6;color:var(--mut);font-weight:700;padding:14px 16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 8px;margin:10px 0 0}
.tabs::-webkit-scrollbar,.subs::-webkit-scrollbar{display:none}

/* 動畫 */

@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.hb.bump svg{animation:pop .32s ease-out}
.stp.bump{animation:stamp .26s ease-out both}
.spin svg{animation:spin1 .7s ease-in-out}
.sn.bump{animation:pop .4s ease-out}
.flip{animation:fade .18s ease-out}
.rise{animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
.tw{animation:tw 1.6s infinite}
.sheetmode .mdl.sheet{animation:up .22s ease-out}

.eqi i:nth-child(2){animation-delay:.2s}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
