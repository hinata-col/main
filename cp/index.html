:root{--ink:#3A2A28;--sky:#5BB8EA;--sky2:#D8EEFB;--sky3:#EAF6FD;--sun:#FFD54A;--pink:#FF8FB1;--bg:#F3F7FA;--mut:#5E4A47;--cream:#FFFBEA}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"VoteRound",system-ui,-apple-system,"Hiragino Maru Gothic ProN","Noto Sans TC",sans-serif;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(circle at 88% 4%,#E3F1FA 0 52px,transparent 53px),radial-gradient(circle at 6% 16%,#E3F1FA 0 34px,transparent 35px),radial-gradient(circle at 94% 34%,#E3F1FA 0 40px,transparent 41px),radial-gradient(circle at 4% 52%,#E3F1FA 0 56px,transparent 57px),radial-gradient(circle at 92% 70%,#E3F1FA 0 36px,transparent 37px),radial-gradient(circle at 8% 88%,#E3F1FA 0 44px,transparent 45px);background-attachment:fixed;line-height:1.6}
button,textarea,input{font-family:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:3px solid var(--ink);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:5}
.brand{display:flex;flex-direction:column;gap:9px}
h1{margin:0;font-size:26px;line-height:1.15;white-space:nowrap;color:var(--sky);-webkit-text-stroke:6px #fff;paint-order:stroke fill;filter:drop-shadow(0 2px 0 var(--ink))}
.subt{font-size:11px;letter-spacing:1.5px;color:var(--mut)}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--ink)}
.seg button{min-height:40px;padding:0 14px;border:0;background:#fff;font-size:14px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--sky)}
.tabs{padding:16px 16px 0}
.tabs .seg button{min-height:44px;padding:0 20px;font-size:15px}
main{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
#view{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink);padding:14px}
.card.intro{display:flex;gap:12px;align-items:center}
.card p{margin:0;text-wrap:balance}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.mut{font-size:13px;color:var(--mut)}
.pill{display:inline-block;font-size:14px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--sky)}
.pill.sun{background:var(--sun)}.pill.white{background:#fff}.pill.gray{background:var(--bg)}
h2{margin:0;font-size:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:2.5px solid var(--ink);border-radius:999px;background:var(--sky);font-size:15px;font-weight:700;box-shadow:0 3px 0 var(--ink);text-align:center}
.btn.ghost{background:#fff}
.btn.big{min-height:52px;width:100%;font-size:18px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.link{min-height:44px;padding:0 10px;border:0;background:transparent;font-size:13px;color:var(--mut);text-decoration:underline}
.slot.empty{border-style:dashed;box-shadow:none;display:flex;align-items:center;gap:10px;padding:12px 14px}
.slot.pend{background:var(--sky3)}
.pairrow{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin:8px 0}
.pairrow>svg{margin-top:18px;flex:none}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;min-width:84px}
.av{position:relative;width:var(--s,60px);height:var(--s,60px);border-radius:50%;border:2.5px solid var(--ink);background:var(--sky2);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s,60px)*.36);flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;background:#fff}
.av.ghost{border-style:dashed;background:#fff}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);margin-top:6px}
input[data-nick],#nick{width:100%;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:15px;background:var(--cream);min-height:44px}

const pending = () => S.pairs.find(p => !p.b) || null;
function pick(id) {
  const k = t(), p = pending();
  if (p) {
    if (p.a === id) { S.pairs.splice(S.pairs.indexOf(p), 1); return; }
    if (S.pairs.some(q => q !== p && q.b && keyOf(q.a, q.b) === keyOf(p.a, id))) { toast(k.dupPair); return; }
    p.b = id; return;
  }
  if (S.pairs.length >= MAX_PAIRS) { toast(k.full); return; }
  S.pairs.push({ a: id, b: null, reason: '', photo: '', blob: null, preview: '' });
}
// 叉掉一組裡的某位成員：留下另一位等你重選；只剩一位時叉掉就是移除整組
function removeMember(i, side) {
  const p = S.pairs[i]; if (!p) return;
  if (!p.b) { S.pairs.splice(i, 1); return; }
  if (side === 'a') p.a = p.b;
  p.b = null;
}
const badges = () => { const m = {}; S.pairs.forEach((p, i) => [p.a, p.b].forEach(id => { if (id) (m[id] = m[id] || []).push(i + 1); })); return m; };

/* ---------- 照片壓縮 ---------- */
async function compress(file) {
  if (!/^image\//.test(file.type)) throw 'bad_type';
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw 'bad_type'; }
  let scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    for (const q of [0.85, 0.7, 0.55]) {
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
      if (b && b.size <= MAX_BYTES) return b;
    }
    scale *= 0.8;
  }
  throw 'too_big';
}

/* ---------- 網路 ---------- */
async function api(body) {
  const r = await fetch(CFG.APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
async function uploadPhoto(blob) {
  const r = await fetch(CFG.WORKER_URL.replace(/\/$/, '') + '/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + S.user.token, 'Content-Type': blob.type }, body: blob });
  const j = await r.json().catch(() => ({}));
  if (!j.ok || !safePhoto(j.url)) throw j.error || 'server';
  return j.url;
}
async function submit() {
  const k = t();
  if (S.busy) return;
  if (!configured) return toast(k.notCfg);
  if (!S.user) return toast(k.needLogin);
  if (S.user.exp * 1000 < Date.now() + 30000) { S.user = null; renderLogin(); return toast(k.expired); }
  if (!S.pairs.length) return toast(k.needPair);
  if (S.pairs.some(p => !p.b)) return toast(k.incomplete);
  let sent = false;
  S.busy = true; render();
  try {
    const out = [];
    for (const p of S.pairs) {
      if (p.blob) { p.photo = await uploadPhoto(p.blob); p.blob = null; }
      out.push({ a: p.a, b: p.b, reason: (p.reason || '').trim().slice(0, MAX_REASON), photo: p.photo || '' });
    }
    const res = await api({ action: 'submit', idToken: S.user.token, pairs: out, nick: (S.nick || '').trim() });
    if (!res.ok) throw res.error || 'server';
    S.submitted = true; S.rank = null; S.detail = {};
    toast(k.done); sent = true;
  } catch (err) { toast(k[ERR[err]] || k.fail); }
  S.busy = false; renderAll();
  if (sent) openCard(true);
}

/* ---------- 分享圖卡（在你的手機／電腦上直接畫成圖片，不經過任何伺服器） ---------- */
const INK = '#3A2A28', SKY = '#5BB8EA', PINK = '#FF8FB1';
const CARD_W = 1080, ROW_H = 190, ROW_GAP = 26, CARD_TOP = 250, CARD_BOTTOM = 150;
const CARD_FONT = 'VoteRound, "Hiragino Maru Gothic ProN", "Noto Sans TC", sans-serif';
const NICK_EXTRA = 56;
const cardTop = nick => CARD_TOP + (nick ? NICK_EXTRA : 0);
const cardSize = (n, nick) => [CARD_W, cardTop(nick) + n * (ROW_H + ROW_GAP) + CARD_BOTTOM];
const loadImg = (src, cors, ms = 8000) => new Promise(res => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; const to = setTimeout(() => res(null), ms); i.onload = () => { clearTimeout(to); res(i); }; i.onerror = () => { clearTimeout(to); res(null); }; i.src = src; });
const avCache = {};
// 成員照片分散在不同網站：先直接載入，被擋就透過 images.weserv.nl 轉一手（作法同本命設定分享卡），再不行就畫姓名首字
const loadAvatar = url => !url ? Promise.resolve(null) : (avCache[url] ||= (async () => (await loadImg(url, true)) || (await loadImg('https://images.weserv.nl/?w=480&url=' + encodeURIComponent(url.replace(/^https?:\/\//, '')), true)))());

function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function fitText(g, text, x, y, maxW, size) {
  let s = size; g.font = `700 ${s}px ${CARD_FONT}`;
  while (s > 22 && g.measureText(text).width > maxW) { s -= 2; g.font = `700 ${s}px ${CARD_FONT}`; }
  g.fillText(text, x, y);
}
function drawAvatar(g, img, cx, cy, r, initial) {
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.closePath(); g.fillStyle = '#D8EEFB'; g.fill(); g.clip();
  if (img) { const sc = Math.max(2 * r / img.width, 2 * r / img.height), w = img.width * sc, h = img.height * sc; g.drawImage(img, cx - w / 2, cy - r - (h - 2 * r) * 0.12, w, h); }
  else { g.fillStyle = INK; g.font = `700 ${Math.round(r * 0.9)}px ${CARD_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(initial, cx, cy + 4); }
  g.restore();
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.closePath(); g.lineWidth = 6; g.strokeStyle = INK; g.stroke();
}
function drawHeart(g, cx, cy, s) {
  g.beginPath(); g.moveTo(cx, cy + s * .9);
  g.bezierCurveTo(cx - s * 1.6, cy - s * .1, cx - s * .9, cy - s * 1.2, cx, cy - s * .35);
  g.bezierCurveTo(cx + s * .9, cy - s * 1.2, cx + s * 1.6, cy - s * .1, cx, cy + s * .9);
  g.closePath(); g.fillStyle = PINK; g.fill(); g.lineWidth = 5; g.lineJoin = 'round'; g.strokeStyle = INK; g.stroke();
}
function drawCard(g, pairs, imgs, k, nick) {
  const [W, H] = cardSize(pairs.length, nick), top = cardTop(nick);
  g.fillStyle = '#F3F7FA'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#E3F1FA';
  [[930, 90, 120], [90, 330, 70], [1000, 700, 90], [70, 1000, 110], [960, H - 160, 80]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  let ts = 100; g.font = `700 ${ts}px ${CARD_FONT}`;
  while (ts > 50 && g.measureText(k.title).width > 860) { ts -= 4; g.font = `700 ${ts}px ${CARD_FONT}`; }
  g.strokeStyle = INK; g.lineWidth = 24; g.strokeText(k.title, W / 2, 146);
  g.strokeStyle = '#fff'; g.lineWidth = 16; g.strokeText(k.title, W / 2, 140);
  g.fillStyle = SKY; g.fillText(k.title, W / 2, 140);
  g.fillStyle = '#5E4A47'; g.font = `500 30px ${CARD_FONT}`; g.fillText('HINATAZAKA46 FAVORITE PAIRS', W / 2, 205);
  if (nick) { g.fillStyle = INK; g.textAlign = 'center'; fitText(g, k.nickOf(nick), W / 2, 262, 860, 44); }
  pairs.forEach((p, i) => {
    const y0 = top + i * (ROW_H + ROW_GAP), cy = y0 + ROW_H / 2, a = MAP[p.a], b = MAP[p.b];
    roundRect(g, 40, y0 + 8, W - 80, ROW_H, 36); g.fillStyle = INK; g.fill();
    roundRect(g, 40, y0, W - 80, ROW_H, 36); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 6; g.strokeStyle = INK; g.stroke();
    g.beginPath(); g.arc(104, cy, 34, 0, Math.PI * 2); g.fillStyle = SKY; g.fill(); g.lineWidth = 5; g.strokeStyle = INK; g.stroke();
    g.fillStyle = INK; g.font = `700 38px ${CARD_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(i + 1), 104, cy + 3);
    drawAvatar(g, imgs[i * 2], 245, cy, 64, a.name[0]);
    drawHeart(g, 340, cy, 24);
    drawAvatar(g, imgs[i * 2 + 1], 435, cy, 64, b.name[0]);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = INK;
    fitText(g, a.name, 540, cy - 12, W - 540 - 70, 46);
    fitText(g, '× ' + b.name, 540, cy + 50, W - 540 - 70, 46);
  });
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = INK; g.font = `700 38px ${CARD_FONT}`; g.fillText(k.cardTag, W / 2, H - 78);
  g.fillStyle = '#5E4A47'; g.font = `500 28px ${CARD_FONT}`; g.fillText('hinata-col.github.io/main/cp/', W / 2, H - 34);
}
async function makeCard() {
  const k = t(), nick = (S.nick || '').trim(), pairs = S.pairs.filter(p => p.b);
  const text = nick + k.nickOf(nick) + pairs.map(p => MAP[p.a].name + MAP[p.b].name).join('') + k.title + k.cardTag + 'HINATAZAKA46 FAVORITE PAIRS hinata-col.github.io/main/cp/0123456789×';
  try { await document.fonts.load(`700 40px VoteRound`, text); await document.fonts.load(`500 28px VoteRound`, text); } catch {}
  const imgs = await Promise.all(pairs.flatMap(p => [loadAvatar(MAP[p.a].avatar), loadAvatar(MAP[p.b].avatar)]));
  const c = document.createElement('canvas'), [W, H] = cardSize(pairs.length, nick);
  c.width = W; c.height = H;
  drawCard(c.getContext('2d'), pairs, imgs, k, nick);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/png'));
}

/* ---------- Google 登入 ---------- */
function decodeJwt(tok) {
  const b = tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b + '='.repeat((4 - b.length % 4) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
async function onCred(resp) {
  try {
    const p = decodeJwt(resp.credential);
    S.user = { token: resp.credential, name: p.name || '', exp: p.exp };
    try { sessionStorage.setItem('cp_tok', resp.credential); } catch {}
  } catch { return; }
  renderAll();
  await loadMine();
}
// 重新整理頁面後，如果登入憑證還沒過期（Google 憑證約 1 小時），就直接沿用，不用再登入
function restoreLogin() {
  let tok = null;
  try { tok = sessionStorage.getItem('cp_tok'); } catch {}
  if (!tok) return false;
  try {
    const p = decodeJwt(tok);
    if (p.exp * 1000 < Date.now() + 60000) { sessionStorage.removeItem('cp_tok'); return false; }
    S.user = { token: tok, name: p.name || '', exp: p.exp };
    return true;
  } catch { try { sessionStorage.removeItem('cp_tok'); } catch {} return false; }
}
async function loadMine() {
  if (S.pairs.length === 0) {
    try {
      const r = await api({ action: 'mine', idToken: S.user.token });
      if (r.ok && r.nick && !S.nick) { S.nick = String(r.nick).slice(0, 12); ls.set('cp_nick', S.nick); }
      if (r.ok && Array.isArray(r.pairs) && r.pairs.length) {
        S.pairs = r.pairs.filter(p => MAP[p.a] && MAP[p.b]).slice(0, MAX_PAIRS).map(p => ({ a: p.a, b: p.b, reason: String(p.reason || ''), photo: safePhoto(p.photo) ? p.photo : '', blob: null, preview: safePhoto(p.photo) ? p.photo : '' }));
        S.submitted = S.pairs.length > 0;
        toast(t().loaded); renderAll();
      }
    } catch {}
  }
}
function initGoogle() {
  if (!configured) return;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = () => { window.google.accounts.id.initialize({ client_id: CFG.GOOGLE_CLIENT_ID, callback: onCred, auto_select: true }); renderLogin(); if (!S.user) window.google.accounts.id.prompt(); };
  document.head.appendChild(s);
}
function renderLogin() {
  const k = t(), el = $('#login');
  el.hidden = S.tab !== 'vote';
  if (S.user) {
    el.innerHTML = `<div class="row"><span>${esc(k.hello(S.user.name))}</span><button class="link" data-act="logout">${k.logout}</button></div>`;
    return;
  }
  el.innerHTML = `<div class="stack"><h2>${k.loginTitle}</h2><div class="sub">${k.loginNote}</div><div id="gbtn" style="min-height:44px;margin-top:8px"></div></div>`;
  if (window.google?.accounts?.id) window.google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: S.lang === 'ja' ? 'ja' : 'zh-TW' });
}

/* ---------- 畫面 ---------- */
const heart = (dash) => `<svg width="32" height="32" viewBox="0 0 24 24" fill="${dash ? '#fff' : '#FF8FB1'}" stroke="#3A2A28" stroke-width="1.8" stroke-linejoin="round" ${dash ? 'stroke-dasharray="3 2"' : ''} aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`;
const xIcon = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3A2A28" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>';
const col = (m, i, side) => `<div class="col"><div class="avw">${avatar(m, 68)}<button class="x" data-act="rmMember" data-i="${i}" data-side="${side}" aria-label="${esc(t().rmMember(m.name))}"><span>${xIcon}</span></button></div><span>${esc(m.name)}</span></div>`;

function slotHTML(i) {
  const k = t(), p = S.pairs[i];
  if (!p) return `<div class="card slot empty"><span class="pill gray">${k.slot(i + 1)}</span><span class="mut">${k.empty}</span></div>`;
  const a = MAP[p.a], b = p.b && MAP[p.b];
  const head = `<div class="row"><span class="pill ${b ? '' : 'white'}">${k.slot(i + 1)}</span>${b ? '' : `<span class="mut">${k.pickSecond}</span>`}<span class="grow"></span><button class="link" data-act="rm" data-i="${i}">${k.clear}</button></div>`;
  if (!b) return `<div class="card slot pend">${head}<div class="pairrow">${col(a, i, 'a')}${heart(true)}<div class="col"><span class="av ghost" style="--s:68px"></span></div></div></div>`;
  const src = p.preview || p.photo;
  return `<div class="card slot">${head}<div class="pairrow">${col(a, i, 'a')}${heart(false)}${col(b, i, 'b')}</div>
<label class="fld">${k.reason}<textarea data-reason="${i}" maxlength="${MAX_REASON}" placeholder="${esc(k.reasonPh)}">${esc(p.reason)}</textarea></label>
<div class="photo"><div class="thumb ${src ? 'has' : ''}">${src ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">` : ''}</div>
<div class="stack"><label class="btn ghost" style="cursor:pointer"><input type="file" accept="image/*" hidden data-photo="${i}">${src ? k.change : k.upload}</label>
${src ? `<button class="link" data-act="rmPhoto" data-i="${i}" style="min-height:36px;text-align:left;padding:0">${k.rmPhoto}</button>` : ''}
<span class="mut" style="font-size:12px">${k.uploadNote}</span></div></div></div>`;
}

function voteHTML() {
  const k = t(), bd = badges(), pend = pending();
  const done = S.pairs.filter(p => p.b).length;
  const warn = configured ? '' : `<div class="card warn mut">${esc(k.notCfg)}</div>`;
  const intro = `<div class="card intro o1"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#3A2A28" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="flex:none"><circle cx="20" cy="20" r="8" fill="#FFD54A"/><path d="M20 4v5M20 31v5M4 20h5M31 20h5M8.7 8.7l3.5 3.5M27.8 27.8l3.5 3.5M31.3 8.7l-3.5 3.5M12.2 27.8l-3.5 3.5"/></svg><p style="white-space:pre-line">${esc(k.intro)}</p></div>`;
  let mycp = `<div class="mycp o2"><div class="row" style="justify-content:space-between"><h2>${k.myCp}</h2><span class="pill sun">${k.progress(done)}</span></div>`;
  for (let i = 0; i < MAX_PAIRS; i++) mycp += slotHTML(i);
  mycp += `</div>`;
  let picker = `<div class="picker o3"><div class="card"><h2>${k.pickTitle}</h2><div class="sub">${k.pickNote}</div></div>`;
  for (const g of groups()) {
    picker += `<div><div class="gh">${g.og ? k.og : k.current}｜${k.gen[g.gen]}</div><div class="grid">`;
    for (const m of g.list) {
      const nums = bd[m.id] || [];
      picker += `<button class="mem ${nums.length ? 'on' : ''} ${pend && pend.a === m.id ? 'pend' : ''}" data-act="pick" data-id="${m.id}" aria-label="${esc(m.name)}">${avatar(m)}${nums.length ? `<span class="bd">${nums.join('·')}</span>` : ''}<span>${esc(m.name)}</span></button>`;
    }
    picker += `</div></div>`;
  }
  picker += `</div>`;
  const cardBtn = S.pairs.some(p => p.b) ? `<button class="btn ghost" data-act="card">${k.cardBtn}</button>` : '';
  const nickBox = `<label class="fld">${k.nickField}<input data-nick type="text" maxlength="12" value="${esc(S.nick || '')}" placeholder="${k.defNick}" autocomplete="nickname"><span class="mut" style="font-size:12px">${k.nickHint}</span></label>`;
  const submit = `<div class="stack o4">${nickBox}<button class="btn big" data-act="submit" ${S.busy ? 'disabled' : ''}>${S.busy ? k.busy : (S.submitted ? k.update : k.submit)}</button>${cardBtn}<span class="mut" style="text-align:center">${k.checkNote}</span></div>`;
  return `${warn}<div class="vgrid"><div class="colL">${intro}${picker}</div><div class="colR">${mycp}${submit}</div></div>`;
}

function rankHTML() {
  const k = t();
  let h = '';
  if (!configured) h += `<div class="card warn mut">${esc(k.notCfg)}</div>`;
  if (S.rank === 'loading') return h + `<div class="card mut">${k.loading}</div>`;
  if (S.rankErr || !S.rank) return h + `<div class="card"><p class="mut">${k.loadFail}</p><button class="btn ghost" data-act="refresh" style="margin-top:8px">${k.refresh}</button></div>`;
  h += `<div class="card"><h2>${k.rankTitle}</h2><div class="sub">${k.rankLead(Number(S.rank.total) || 0)}</div></div>`;
  const rows = (S.rank.pairs || []).filter(r => MAP[r.a] && MAP[r.b]);
  if (!rows.length) h += `<div class="card mut">${k.noData}</div>`;
  let rk = 0, last = null;
  h += `<div class="rk">`;
  rows.forEach((r, i) => {
    if (r.count !== last) { rk = i + 1; last = r.count; }
    const a = MAP[r.a], b = MAP[r.b], open = S.open === r.key, d = S.detail[r.key];
    h += `<div class="card"><button class="rrow" data-act="toggle" data-key="${esc(r.key)}" aria-expanded="${open}"><span class="rn ${rk <= 3 ? 'r' + rk : ''}">${rk}</span><span class="avs">${avatar(a, 46)}${avatar(b, 46)}</span><span class="names">${esc(a.name)} × ${esc(b.name)}</span><span class="cnt">${Number(r.count) || 0}<small> ${k.votes}</small></span></button>`;
    if (open) {
      h += `<div class="det">`;
      if (d === 'loading' || d === undefined) h += `<span class="mut">${k.loading}</span>`;
      else {
        const rs = d.filter(x => x.r), ph = d.filter(x => safePhoto(x.p));
        h += rs.length ? rs.map(x => `<div class="h3">${esc(x.n || k.defNick)}</div><div class="rs">${esc(x.r)}</div>`).join('') : `<div class="h3">${k.reasons}</div><span class="mut">${k.noReason}</span>`;
        if (ph.length) h += `<div class="h3">${k.photos}</div><div class="pg">${ph.map(x => `<a href="${esc(x.p)}" target="_blank" rel="noopener"><img src="${esc(x.p)}" alt="" loading="lazy"></a>`).join('')}</div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  });
  h += `</div><button class="btn ghost" data-act="refresh">${k.refresh}</button>`;
  return h;
}

function render() {
  const y = window.scrollY;
  $('#view').innerHTML = S.tab === 'vote' ? voteHTML() : rankHTML();
  window.scrollTo(0, y);
}
function renderAll() {
  const k = t();
  document.documentElement.lang = k.htmlLang; document.title = k.title; $('#h1').textContent = k.title;
  document.querySelectorAll('#langseg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)));
  document.querySelectorAll('#tabseg button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.tab === S.tab)); b.textContent = b.dataset.tab === 'vote' ? k.tabVote : k.tabRank; });
  renderLogin(); render();
}

async function loadRank(force) {
  if (!force && S.rank && S.rank !== 'loading') return;
  S.rankErr = false; S.rank = 'loading'; render();
  try {
    if (!configured) throw 0;
    const r = await (await fetch(CFG.APPS_SCRIPT_URL + '?action=ranking')).json();
    if (!r.ok) throw 0;
    S.rank = r;
  } catch { S.rank = null; S.rankErr = true; }
  render();
}
async function loadDetail(key) {
  S.detail[key] = 'loading'; render();
  try {
    const r = await (await fetch(CFG.APPS_SCRIPT_URL + '?action=detail&key=' + encodeURIComponent(key))).json();
    S.detail[key] = r.ok && Array.isArray(r.items) ? r.items : [];
  } catch { S.detail[key] = []; }
  render();
}

/* ---------- 事件 ---------- */
$('#langseg').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (!b) return; S.lang = b.dataset.lang; ls.set('cp_lang', S.lang); renderAll(); });
$('#tabseg').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  S.tab = b.dataset.tab; history.replaceState(null, '', S.tab === 'rank' ? '#rank' : location.pathname + location.search);
  renderAll(); if (S.tab === 'rank') loadRank(false);
});
$('#login').addEventListener('click', e => {
  if (e.target.closest('[data-act="logout"]')) { S.user = null; try { sessionStorage.removeItem('cp_tok'); } catch {} window.google?.accounts?.id?.disableAutoSelect(); renderAll(); }
});
$('#view').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, i = Number(el.dataset.i);
  if (act === 'pick') { pick(el.dataset.id); render(); }
  else if (act === 'rm') { S.pairs.splice(i, 1); render(); }
  else if (act === 'rmPhoto') { const p = S.pairs[i]; if (p.preview && p.blob) URL.revokeObjectURL(p.preview); p.photo = ''; p.blob = null; p.preview = ''; render(); }
  else if (act === 'submit') submit();
  else if (act === 'rmMember') { removeMember(i, el.dataset.side); render(); }
  else if (act === 'card') openCard(false);
  else if (act === 'refresh') { S.detail = {}; S.open = null; loadRank(true); }
  else if (act === 'toggle') { const key = el.dataset.key; S.open = S.open === key ? null : key; render(); if (S.open && S.detail[key] === undefined) loadDetail(key); }
});
$('#view').addEventListener('input', e => {
  const nk = e.target.closest('[data-nick]');
  if (nk) { S.nick = nk.value.replace(/[\u0000-\u001f]/g, '').slice(0, 12); ls.set('cp_nick', S.nick); return; }
  const el = e.target.closest('[data-reason]'); if (!el) return;
  S.pairs[Number(el.dataset.reason)].reason = el.value;
});
$('#view').addEventListener('change', async e => {
  const el = e.target.closest('[data-photo]'); if (!el || !el.files[0]) return;
  const i = Number(el.dataset.photo), p = S.pairs[i], file = el.files[0];
  try {
    const blob = await compress(file);
    if (p.preview && p.blob) URL.revokeObjectURL(p.preview);
    p.blob = blob; p.preview = URL.createObjectURL(blob); p.photo = '';
    render();
  } catch (err) { toast(t()[ERR[err]] || t().fail); }
});

// 成員頭像：主站會自動同步最新公式照到 members/{id}/avatar，讀得到就換成最新的，讀不到沿用名單內建網址（作法同歌曲票選）
const MAIN_DB = 'https://hinata-collection-default-rtdb.asia-southeast1.firebasedatabase.app';
async function syncAvatars() {
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch(MAIN_DB + '/members.json', { signal: ctl.signal });
    clearTimeout(to);
    if (!r.ok) return;
    const o = await r.json();
    if (!o || typeof o !== 'object') return;
    let changed = false;
    for (const m of MEMBERS) {
      const u = o[m.id] && o[m.id].avatar;
      if (typeof u === 'string' && /^https:\/\//.test(u) && u !== m.avatar) { m.avatar = u; changed = true; }
    }
    if (changed) render();
  } catch {}
}

// 照片牆：縮圖是正方形裁切（排版整齊），點開用燈箱看完整原圖，橫式直式都不會被切
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('.pg a'); if (!a) return;
  e.preventDefault(); e.stopPropagation();
  const k = t();
  $('#mdlT').textContent = k.photos;
  $('#mdlBody').innerHTML = `<img src="${esc(a.getAttribute('href'))}" alt="" style="max-height:70vh;object-fit:contain;background:var(--sky3)">`;
  $('#mdlBtns').innerHTML = `<a class="btn ghost" href="${esc(a.getAttribute('href'))}" target="_blank" rel="noopener">${k.openOrig}</a><button class="btn" data-m="close">${k.close}</button>`;
  $('#modal').hidden = false; $('#modal .mdl').focus();
}, true);
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal' || e.target.closest('[data-m="close"]')) return closeCard();
  if (e.target.closest('[data-m="share"]')) shareCard();
});
$('#modal').addEventListener('input', e => {
  if (e.target.id !== 'nick') return;
  S.nick = e.target.value.replace(/[\u0000-\u001f]/g, '').slice(0, 12);
  try { localStorage.setItem('cp_nick', S.nick); } catch {}
  clearTimeout(nickTimer); nickTimer = setTimeout(regenCard, 350);
});
$('#modal').addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

const restored = restoreLogin();
renderAll(); initGoogle(); syncAvatars();
if (restored) loadMine();
if (S.tab === 'rank') loadRank(false);
</script>
</body>
</html>
